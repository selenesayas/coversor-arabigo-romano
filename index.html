<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Conversor Romano ↔ Arábigo</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #7ab6ff, #d7c3ff);
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .card {
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        width: 400px;
        text-align: center;
    }
    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 10px;
        border: 1px solid #aaa;
        font-size: 16px;
    }
    button {
        padding: 10px 20px;
        background: #7a4cff;
        border: none;
        color: white;
        border-radius: 10px;
        margin-top: 10px;
        cursor: pointer;
    }
    hr {
        margin: 20px 0;
        border: none;
        border-top: 1px solid #ccc;
    }
</style>
</head>
<body>

<div class="card">
    <h2>Conversor Romano ↔ Arábigo</h2>

    <h3>De Arábigo a Romano</h3>
    <input id="arabigo" placeholder="Ej: 154">
