<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Conversor Romano ↔ Arábigo</title>
<style>
    body {
        font-family: Arial;
        background: linear-gradient(135deg, #7ab6ff, #d7c3ff);
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .card {
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        width: 400px;
        text-align: center;
    }
    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 10px;
        border: 1px solid #aaa;
        font-size: 16px;
    }
    button {
        padding: 10px 20px;
        background: #7a4cff;
        border: none;
        color: white;
        border-radius: 10px;
        margin-top: 10px;
        cursor: pointer;
    }
</style>
</head>
<body>

<div class="card">
    <h2>Conversor Romano ↔ Arábigo</h2>

    <h3>De Arábigo a Romano</h3>
    <input id="arabigo" placeholder="Ej: 154">
    <button onclick="convertirA2R()">Convertir</button>
    <p id="resultadoA2R"></p>

    <hr>

    <h3>De Romano a Arábigo</h3>
    <input id="romano" placeholder="Ej: CLIV">
    <button onclick="convertirR2A()">Convertir</button>
    <p id="resultadoR2A"></p>
</div>

<script>
async function convertirA2R() {
    const numero = document.getElementById("arabigo").value;
    const res = await fetch(`/a2r?numero=${numero}`);
    const data = await res.json();
    document.getElementById("resultadoA2R").innerHTML = data.resultado || data.error;
}

async function convertirR2A() {
    const numero = document.getElementById("romano").value;
    const res = await fetch(`/r2a?numero=${numero}`);
    const data = await res.json();
    document.getElementById("resultadoR2A").innerHTML = data.resultado || data.error;
}
</script>

</body>
</html>
